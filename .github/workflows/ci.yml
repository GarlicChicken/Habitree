# 세 OS에서 시험과 자기 점검을 돌린다. / Tests and self-check on Windows, macOS and Linux.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"   # UTF-8 모드에 기대지 않는다 / do not rely on UTF-8 mode
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit and conformance tests
        run: python -m unittest discover -s tests -t tests -v
      - name: self check (dogfood)
        run: python -m habitree check
      - name: package installs and runs
        run: |
          python -m pip install .
          habitree --version
          ht --version
