[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "habitree"
dynamic = ["version"]
description = "Grow good habits for AI coding: a mistake corrected once becomes a rule, so the agent stops repeating it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.9"
authors = [{ name = "GarlicChicken" }]
keywords = ["ai", "coding-agent", "claude-code", "agents-md", "rules", "token", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/GarlicChicken/habitree"
Issues = "https://github.com/GarlicChicken/habitree/issues"

[project.scripts]
habitree = "habitree.cli:main"
ht = "habitree.cli:main"

[tool.hatch.version]
path = "src/habitree/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/habitree"]

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "tests", "conformance", "README.md", "LICENSE", "NOTICE.md", "CHANGELOG.md"]
